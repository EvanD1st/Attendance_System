components:
  schemas:
    ActionEnum:
      enum:
      - CLOCK_IN
      - CLOCK_OUT
      type: string
      description: |-
        * `CLOCK_IN` - Clock in
        * `CLOCK_OUT` - Clock out
    AdminException:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        employee:
          type: integer
        employee_number:
          type: string
          readOnly: true
        employee_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
        reason:
          type: string
        approved_by:
          type: integer
          readOnly: true
        approved_by_email:
          type: string
          format: email
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approved_by
      - approved_by_email
      - created_at
      - date
      - employee
      - employee_name
      - employee_number
      - id
      - reason
    AttendanceAttempt:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        employee_number:
          type: string
          readOnly: true
        employee_name:
          type: string
          readOnly: true
        site_name:
          type: string
          readOnly: true
        kiosk_name:
          type: string
          readOnly: true
        request_id:
          type: string
          format: uuid
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          readOnly: true
        accuracy_meters:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
          readOnly: true
        captured_at:
          type: string
          format: date-time
          readOnly: true
        received_at:
          type: string
          format: date-time
          readOnly: true
        distance_meters:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        accepted:
          type: boolean
          readOnly: true
        reason_code:
          type: string
          readOnly: true
        reason_detail:
          type: string
          readOnly: true
        employee:
          type: integer
          readOnly: true
        site:
          type: integer
          readOnly: true
          nullable: true
        kiosk:
          type: string
          format: uuid
          readOnly: true
          nullable: true
        record:
          type: integer
          readOnly: true
          nullable: true
      required:
      - accepted
      - accuracy_meters
      - action
      - captured_at
      - distance_meters
      - employee
      - employee_name
      - employee_number
      - id
      - kiosk
      - kiosk_name
      - latitude
      - longitude
      - reason_code
      - reason_detail
      - received_at
      - record
      - request_id
      - site
      - site_name
    AttendanceCorrection:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        record:
          type: integer
          readOnly: true
        record_details:
          allOf:
          - $ref: '#/components/schemas/AttendanceRecord'
          readOnly: true
        corrected_by:
          type: integer
          readOnly: true
        corrected_by_email:
          type: string
          format: email
          readOnly: true
        reason:
